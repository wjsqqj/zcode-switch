      #splash {
        position: fixed; inset: 0; z-index: 999;
        background: #0a0a0c;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .18s ease;

        width: 72px; height: 72px;

      }

        #splash img { animation: none; }
        #splash { transition: none; }
      }
