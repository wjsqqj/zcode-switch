name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: macos-latest
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Z·SWITCH ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新（v1.7.4-Z.EMAIL）

            ### 修复：生效时间显示错误、已领取信息缺失、活动刷不出来

            - **生效时间不再用活动开始时间冒充**：`starts_at`（活动开始）与 `entitlements[].effective_at`（权益生效）彻底分开，可领 / 已领取 / 详情统一按「字段 → 活动文案兜底 → 领取后确认」取值；文案兜底标注「预计 … 生效（据活动说明）」，时间统一为 `YYYY-MM-DD HH:mm`
            - **已领取也能看到时间区间**：领取历史落盘 `startsAt / endsAt / effectiveAt`，行内条与详情显示「已领取过 X · 生效 … → 至 …」，老记录显示「时间未记录」
            - **退出重登后已领取记录不再丢**：历史按 `userId`（JWT sub）兜底匹配，重登换了 accountId 也能命中
            - **领取后活动从列表消失**：`billing/current` 在权益生效前返回空，改用 `billing/balance` 的 `Start Plan` 套餐名推断「已领取」，面板补一条并标「已领取（待生效）」
            - **刷不出来时看得懂原因**：新增版本诊断（上报版本 / 官方最新 / 缓存是否过期 / 内置常量是否落后），活动面板空态直接给出原因与「官方客户端领取无法同步」说明；`--cli claim-raw` 增加 `_meta`（版本、token 来源、device mid 掩码，不含令牌）
            - **preview 404 / 报错不再整单失败**：404 视为「今日未投放」静默为空；preview 报错时用 `marketing/touch` 结果兜底展示，两通道都空才报错
            - **弹性 HTTP 层（移植 PR #43）**：`zcode.z.ai` 请求改为「系统 curl(Schannel) 优先 + ureq(native-tls) 兜底」，2xx 空 body / 非 JSON 视为传输失败自动换通道；凭据只经 stdin 传递，不出现在命令行
            - **版本保鲜三兜底**：`CLIENT_APP_VERSION` 升到 3.17.2、changelog 缓存 TTL 收紧到 6h；启动与首次刷新活动时若缓存缺失会同步拉取（3s / 2s 硬超时）；新增安装包内置 `known-latest.json` 快照（打包时自动刷新），换机 / 缓存被清 / 首次离线不再退回过期版本号
            - 活动面板空态补充「活动通常每天 19:00（北京时间）后放量」说明

            ## 关于本项目

            本项目基于 [pjpv/zcode-switch](https://github.com/pjpv/zcode-switch) 原开源的基础上增加的功能如下：

            - 添加 z.ai 邮箱登录支持和界面增强
            - 实现 zai 登录接力机制：先通过官网登录页建立会话，再跳转到授权端点获取令牌
            - 在 OAuth 流程中添加邮箱辅助功能，注入 JavaScript 按钮条供用户切换邮箱登录/注册
            - 添加页面导航监控和 URL 轮询机制，确保登录完成后正确接力到授权页面
            - 邮箱与手机号表单在同一页面上，按钮条按「当前可见表单」做页内切换，跨第三方页时靠 URL fragment 携带切换意图

            见 [README](https://github.com/${{ github.repository }}/blob/main/README.md) 了解完整功能。

            ## 下载

            - **Windows**：`*_x64-setup.exe` 安装包（推荐）／`*_portable.exe` 便携版
            - **macOS**：`*_aarch64.dmg`（Apple 芯片）／`*_x64.dmg`（Intel 芯片）
            - **Linux**：`*.deb`／`*.AppImage`

            ## 未签名提示

            - Windows：SmartScreen 选「更多信息 → 仍要运行」
            - macOS：Gatekeeper 右键打开
            - Linux：AppImage 需 `chmod +x`

            SHA-256 校验和见各 `checksums-*.txt`。
          releaseDraft: false
          # 本 fork 的正式版本带 -Z.EMAIL 后缀，需要标成 Latest；只有 -beta 才是预发布
          #（预发布会被 GitHub 排除在 Latest 之外，所以 Latest 必须 prerelease=false）
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          makeLatest: 'true'
          args: --bundles ${{ matrix.bundles }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload portable exe + checksums (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/zcode-switch.exe" "zcode-switch_${VER}_portable.exe"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          sha256sum "zcode-switch_${VER}_portable.exe" "$SETUP" | sed 's| .*/| |' > "checksums-Windows-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "zcode-switch_${VER}_portable.exe" "checksums-Windows-${GITHUB_REF_NAME}.txt" --clobber

      - name: Upload checksums
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGT="${{ matrix.rust_target }}"
          [ -n "$TGT" ] || TGT="native"
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            | xargs sha256sum | sed 's| .*/| |' > "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt" --clobber