name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: macos-latest
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Z·SWITCH ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新（v1.7.2-Z.EMAIL）

            ### 新增：活动中心

            - 活动详情：汇总所有账号的活动，分「可领 / 已领取 / 已过期」三组；展开可见活动 ID、套餐 ID、展示位、账号、状态、活动开始 / 生效时间 / 结束时间、奖励、文案与按钮动作
            - 活动探测（默认关）：开启后立即探测，活跃时段每 20–25 分钟随机探测 2 个账号；只读 marketing/touch，不领取、不写历史
            - 活动提醒：新活动弹窗、托盘红点闪烁、托盘右键菜单、窗口标题，窗口隐藏时同时发系统通知
            - 弹框内直接领取：可领条目带「领取」按钮，无需关闭弹框
            - 到点自动领取（默认关）：启动 30s 后首查，之后每 60s 检查「已开始且未领取」的活动并尝试领取

            ### 修复

            - 领取刷新「点了没反应 / 界面卡死」：阻塞 I/O 移入 spawn_blocking，准入统一为 refreshGate，冷却倒计时改为局部更新
            - 「活动 ID / 展示位未提供」：preview 与 marketing 下发同一 plan 时去重后补齐活动元数据，支持结构化文案
            - 「已领过」的活动不显示：启动时补拉 billing/current，并持久化活动目录，重启后仍可展示
            - 领取后「可领条 / 领取按钮」不消失
            - 弹框内按钮点击无效
            - 「到点自动领取」对已开始的活动不生效
            - 自动领取超时取消误清用户手动发起的领取
            - 可领提醒只提醒一次、错过就沉默

            ### 行为调整

            - 冷却期零上游流量：claim_preview 直接拒绝、claim_current 只回本地历史
            - 3007（验证码被拒）不再自动换码重试，自动领取失败持有期延长到 60 分钟
            - 一次性赠送池是否生效改为以 entitlements.effective_at 判定
            - 领取提示「额度将于 {time} 生效」改用 effective_at（0 = 立即生效）

            ## 关于本项目

            本项目基于 [pjpv/zcode-switch](https://github.com/pjpv/zcode-switch) 原开源的基础上增加的功能如下：

            - 添加 z.ai 邮箱登录支持和界面增强
            - 实现 zai 登录接力机制：先通过官网登录页建立会话，再跳转到授权端点获取令牌
            - 在 OAuth 流程中添加邮箱辅助功能，注入 JavaScript 按钮条供用户切换邮箱登录/注册
            - 添加页面导航监控和 URL 轮询机制，确保登录完成后正确接力到授权页面
            - 支持从手机号登录页面返回邮箱登录页面的功能

            见 [README](https://github.com/${{ github.repository }}/blob/main/README.md) 了解完整功能。

            ## 下载

            - **Windows**：`*_x64-setup.exe` 安装包（推荐）／`*_portable.exe` 便携版
            - **macOS**：`*_aarch64.dmg`（Apple 芯片）／`*_x64.dmg`（Intel 芯片）
            - **Linux**：`*.deb`／`*.AppImage`

            ## 未签名提示

            - Windows：SmartScreen 选「更多信息 → 仍要运行」
            - macOS：Gatekeeper 右键打开
            - Linux：AppImage 需 `chmod +x`

            SHA-256 校验和见各 `checksums-*.txt`。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.bundles }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload portable exe + checksums (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/zcode-switch.exe" "zcode-switch_${VER}_portable.exe"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          sha256sum "zcode-switch_${VER}_portable.exe" "$SETUP" | sed 's| .*/| |' > "checksums-Windows-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "zcode-switch_${VER}_portable.exe" "checksums-Windows-${GITHUB_REF_NAME}.txt" --clobber

      - name: Upload checksums
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGT="${{ matrix.rust_target }}"
          [ -n "$TGT" ] || TGT="native"
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            | xargs sha256sum | sed 's| .*/| |' > "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt" --clobber