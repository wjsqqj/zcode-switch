name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: macos-latest
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Z·SWITCH ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新（v1.7.3-Z.EMAIL）

            ### 修复：z.ai 登录窗口里的登录方式切换（手机号 / 邮箱 / Google / GitHub）

            - **同页表单切换**：登录页把邮箱表单和手机号表单放在同一个页面（手机号表单默认隐藏）。辅助按钮条不再把它们当成两个页面：点「手机号登录」就地切出手机号表单，点「邮箱登录」就地切回邮箱表单，不再产生多余的整页跳转
            - **修掉「已在邮箱登录页」误报**：停在 GitHub 授权页时不再拿对方页面文案做判断（GitHub 登录页自带的 `Forgot password?` 正是旧判据的命中项）；当前显示的是手机号表单时点「邮箱登录」会正确切换，而不是提示你已经在该页
            - 新增「已在手机号登录页」提示（中 / 英文）
            - **修掉「从 GitHub 页点手机号登录，结果停在邮箱登录页」**：跳转意图改挂在 URL fragment 与 `window.name` 上携带（`sessionStorage` 按 origin 隔离，跨域写入的意图到 z.ai 后读不到），落地后自动补点直到目标表单真的可见，并把标记从地址栏抹掉以保证只切换一次
            - **判定更耐用**：「当前显示哪个表单」改用可见输入框的 `type` / `placeholder` / `name` 特征判断；页内切换入口改为多重探测 + 逐级降级（文字 tab → 旧版 Z.ai 图标按钮 → 短文案容器），页面结构小改不至于失效
            - **注入幂等**：同一页面被重复注入不再叠加多个轮询、不会把「授权」点两次；授权确认页改为常驻轮询，SPA 内部路由进到授权页也能自动点「授权」
            - 登录辅助条按域名收敛：非 z.ai 域名（GitHub / Google）只做整页跳回，不碰对方 DOM

            ## 关于本项目

            本项目基于 [pjpv/zcode-switch](https://github.com/pjpv/zcode-switch) 原开源的基础上增加的功能如下：

            - 添加 z.ai 邮箱登录支持和界面增强
            - 实现 zai 登录接力机制：先通过官网登录页建立会话，再跳转到授权端点获取令牌
            - 在 OAuth 流程中添加邮箱辅助功能，注入 JavaScript 按钮条供用户切换邮箱登录/注册
            - 添加页面导航监控和 URL 轮询机制，确保登录完成后正确接力到授权页面
            - 邮箱与手机号表单在同一页面上，按钮条按「当前可见表单」做页内切换，跨第三方页时靠 URL fragment 携带切换意图

            见 [README](https://github.com/${{ github.repository }}/blob/main/README.md) 了解完整功能。

            ## 下载

            - **Windows**：`*_x64-setup.exe` 安装包（推荐）／`*_portable.exe` 便携版
            - **macOS**：`*_aarch64.dmg`（Apple 芯片）／`*_x64.dmg`（Intel 芯片）
            - **Linux**：`*.deb`／`*.AppImage`

            ## 未签名提示

            - Windows：SmartScreen 选「更多信息 → 仍要运行」
            - macOS：Gatekeeper 右键打开
            - Linux：AppImage 需 `chmod +x`

            SHA-256 校验和见各 `checksums-*.txt`。
          releaseDraft: false
          # 本 fork 的正式版本带 -Z.EMAIL 后缀，需要标成 Latest；只有 -beta 才是预发布
          #（预发布会被 GitHub 排除在 Latest 之外，所以 Latest 必须 prerelease=false）
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          makeLatest: 'true'
          args: --bundles ${{ matrix.bundles }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload portable exe + checksums (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/zcode-switch.exe" "zcode-switch_${VER}_portable.exe"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          sha256sum "zcode-switch_${VER}_portable.exe" "$SETUP" | sed 's| .*/| |' > "checksums-Windows-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "zcode-switch_${VER}_portable.exe" "checksums-Windows-${GITHUB_REF_NAME}.txt" --clobber

      - name: Upload checksums
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGT="${{ matrix.rust_target }}"
          [ -n "$TGT" ] || TGT="native"
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            | xargs sha256sum | sed 's| .*/| |' > "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt" --clobber