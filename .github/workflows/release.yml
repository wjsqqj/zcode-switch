name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # macos-latest 在免费共享池里常排队 15 分钟后被取消；固定 macos-14（arm64）
          # 并交叉编译 x64，两个 job 用同一池，避免每次发版卡在调度。
          - os: macos-14
            bundles: dmg
          - os: macos-14
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Z·SWITCH ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新（v1.7.5-Z.EMAIL）

            ### 新增：macOS 原生 Liquid Glass 界面（感谢 @245678000000）

            - **玻璃侧栏**：主窗改为侧栏布局，侧栏由 `NSGlassEffectView` / `NSVisualEffectView` 挂在 WKWebView 下方，取样桌面与后方窗口；WebView 内对应区域镂空，不做二次绘制
            - **工具栏胶囊**：刷新 / 活动按钮收进浮动胶囊（取样窗口底色）；标题栏与胶囊区域支持拖动窗口
            - **设置窗外框**：设置窗口同样改为透明 + Overlay 标题栏，外观跟随系统深浅色切换
            - **平台隔离**：原生调用由 `#[cfg(target_os = "macos")]` 与前端 `IS_MAC` 双重保护，Windows / Linux 保持原有布局与主题；`src/mac.css` 全部选择器限定在 `html.mac` 下

            ### 新增：活动诊断日志与一键导出

            - 每次刷新 / 探测活动都会写一行结构化摘要（`acct` 掩码、上报版本、token 来源、`preview` 与 `marketing` 的 HTTP 状态 / 业务码 / 条数、`transport`、耗时），便于对比「别人刷不出、我能刷出」的两端差异
            - 设置页新增「导出诊断日志」：一键保存脱敏 JSON（版本诊断、账号摘要、最近刷新记录、日志尾部）；CLI 支持 `--cli diag` 直接打印
            - 导出双保险脱敏：采集阶段只写掩码 id 与数字，导出前再把 `Bearer` 令牌与长 hex/uuid 打码，不包含令牌、完整设备号、完整账号 id

            ### 其他

            - 修复非 macOS 目标下玻璃帧结构体的 `dead_code` 告警，`cargo check` 恢复零告警

            ### 上一版（v1.7.4）主要内容

            - 生效时间只认 `entitlements.effective_at`，不再用活动开始时间冒充；文案兜底标注来源并统一带年份
            - 领取历史落盘时间并按 `userId` 匹配，退出重登不丢已领取记录；`billing/current` 为空时用 `billing/balance` 的 Start Plan 推断「已领取」
            - preview 404 静默为「今日未投放」、preview 失败降级到 `marketing/touch`；活动面板空态给出渠道 / 版本 / 投放窗口诊断
            - `zcode.z.ai` 请求改为 curl(Schannel) 优先 + ureq(native-tls) 兜底，2xx 空 body 视为传输失败自动换通道
            - 版本保鲜三兜底：常量 3.17.2、changelog TTL 6h、启动与首次刷新缺失同步、安装包内置 `known-latest.json` 快照

            ## 关于本项目

            本项目基于 [pjpv/zcode-switch](https://github.com/pjpv/zcode-switch) 原开源的基础上增加的功能如下：

            - 添加 z.ai 邮箱登录支持和界面增强
            - 实现 zai 登录接力机制：先通过官网登录页建立会话，再跳转到授权端点获取令牌
            - 在 OAuth 流程中添加邮箱辅助功能，注入 JavaScript 按钮条供用户切换邮箱登录/注册
            - 添加页面导航监控和 URL 轮询机制，确保登录完成后正确接力到授权页面
            - 邮箱与手机号表单在同一页面上，按钮条按「当前可见表单」做页内切换，跨第三方页时靠 URL fragment 携带切换意图

            见 [README](https://github.com/${{ github.repository }}/blob/main/README.md) 了解完整功能。

            ## 下载

            - **Windows**：`*_x64-setup.exe` 安装包（推荐）／`*_portable.exe` 便携版
            - **macOS**：`*_aarch64.dmg`（Apple 芯片）／`*_x64.dmg`（Intel 芯片）
            - **Linux**：`*.deb`／`*.AppImage`

            ## 未签名提示

            - Windows：SmartScreen 选「更多信息 → 仍要运行」
            - macOS：Gatekeeper 右键打开
            - Linux：AppImage 需 `chmod +x`

            SHA-256 校验和见各 `checksums-*.txt`。
          releaseDraft: false
          # 本 fork 的正式版本带 -Z.EMAIL 后缀，需要标成 Latest；只有 -beta 才是预发布
          #（预发布会被 GitHub 排除在 Latest 之外，所以 Latest 必须 prerelease=false）
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          makeLatest: 'true'
          args: --bundles ${{ matrix.bundles }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload portable exe + checksums (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/zcode-switch.exe" "zcode-switch_${VER}_portable.exe"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          sha256sum "zcode-switch_${VER}_portable.exe" "$SETUP" | sed 's| .*/| |' > "checksums-Windows-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "zcode-switch_${VER}_portable.exe" "checksums-Windows-${GITHUB_REF_NAME}.txt" --clobber

      - name: Upload checksums
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGT="${{ matrix.rust_target }}"
          [ -n "$TGT" ] || TGT="native"
          # macOS 预装的是 shasum，没有 GNU sha256sum（否则 xargs 直接 No such file）
          if command -v sha256sum >/dev/null 2>&1; then
            HASH=(sha256sum)
          else
            HASH=(shasum -a 256)
          fi
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
            | xargs -0 "${HASH[@]}" | sed 's| .*/| |' > "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt" --clobber