[package]
name = "zcode-switch"
version = "1.7.4-Z.EMAIL"
description = "ZCode 账号切换器"
license = "MIT"
edition = "2021"

[lib]
name = "zcode_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# native-tls 在 Windows 上走 Schannel，指纹与系统客户端一致（ureq 需显式在 AgentBuilder 上挂 connector）。
# 参考 PR#43：zcode.z.ai 前置 WAF 会因 TLS 指纹静默降级，双通道（curl + native-tls）互为兜底。
ureq = { version = "2", features = ["json", "native-tls"] }
native-tls = "0.2"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 原生玻璃（glass.rs）：NSGlassEffectView / NSVisualEffectView 挂在 WKWebView 下方
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSGraphics", "NSAppearance", "NSGlassEffectView", "NSVisualEffectView", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "CGPath"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }

[target.'cfg(not(windows))'.dependencies]
# X-Client-Timezone 的 IANA 名（Node Intl 同源）
iana-time-zone = "0.1"

[profile.release]
strip = "symbols"
lto = "thin"
